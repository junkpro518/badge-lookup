<style>

const norm = s => s
  .replace(/[ً-ْـ]/g, "")      // تشكيل وتطويل
  .replace(/[أإآٱ]/g, "ا").replace(/ة/g, "ه").replace(/ى/g, "ي").replace(/ؤ/g, "و").replace(/ئ/g, "ي")
  .replace(/[-_.ـ]+/g, " ")
  .replace(/عبد\s+ال/g, "عبدال")            // «عبد العزيز» = «عبدالعزيز»
  .replace(/\s+/g, " ").trim().toLowerCase();
const toLatinDigits = s => s.replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d));
const INDEX = DATA.map(r => ({r, n: norm(r[2])}));
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(list, total) {
  const out = document.getElementById("out");
  document.getElementById("count").textContent = total == null ? ""
    : `${total} نتيجة` + (total > list.length ? ` (يُعرض أول ${list.length})` : "");
  if (total === 0) { out.innerHTML = '<div class="empty">ما فيه نتيجة. جرّب جزء من الاسم أو الرقم.</div>'; return; }
  out.innerHTML = list.map(([s, b, name]) => `
    <div class="card">
      <div class="name">${esc(name)}</div>
      <div class="grid">
        <div class="f"><b>رقم البطاقة (HQP-Badge)</b><span>${b}</span></div>
        <div class="f"><b>التسلسل (S)</b><span>${s}</span></div>
      </div>
    </div>`).join("");
}

function search(raw) {
  const q = toLatinDigits(raw).trim();
  if (!q) return render([], null);
  if (/^\d+$/.test(q) ? q.length < 4 : norm(q).replace(/ /g, "").length < 3) {
    document.getElementById("count").textContent = "اكتب ٤ أرقام أو ٣ حروف على الأقل";
    document.getElementById("out").innerHTML = ""; return;
  }
  let hits;
  if (/^\d+$/.test(q)) {
    hits = DATA.filter(r => r[1].includes(q));
    hits.sort((a, b) => (b[1] === q) - (a[1] === q) || (b[1].startsWith(q)) - (a[1].startsWith(q)) || a[0] - b[0]);
  } else {
    const words = norm(q).split(" ").filter(Boolean);
    hits = INDEX.filter(x => words.every(w => x.n.includes(w))).map(x => x.r);
  }
  render(hits.slice(0, 20), hits.length);
}
const input = document.getElementById("q");
input.addEventListener("input", e => search(e.target.value));
const qs = new URLSearchParams(location.search).get("q");
if (qs) { input.value = qs; search(qs); } else render([], null);
